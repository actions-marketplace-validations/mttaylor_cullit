name: Launch Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint (warning budget enforced)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Validate pricing consistency
        run: |
          grep -q '<div class="plan-name">Pro</div>' site/pricing.html
          grep -q '\$9 <span class="period">/ mo</span>' site/pricing.html
          grep -q '<div class="plan-name">Team</div>' site/pricing.html
          grep -q '\$19 <span class="period">/ seat / mo</span>' site/pricing.html
          grep -q 'Pro (\$9/mo)' site/free-trial.html
          grep -q 'Team (\$19/seat/mo)' site/free-trial.html

      - name: Validate legal trust links
        run: |
          grep -q 'Cancel anytime from the <a href="dashboard.html">billing dashboard</a>' site/pricing.html
          grep -q 'All fees are non-refundable except as required by law' TERMS.md

      - name: Summarize launch gate
        run: |
          echo "## Launch Gate: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Build/Test/E2E passed" >> $GITHUB_STEP_SUMMARY
          echo "- Lint warning budget respected (max 250)" >> $GITHUB_STEP_SUMMARY
          echo "- Pricing and legal trust checks validated" >> $GITHUB_STEP_SUMMARY
