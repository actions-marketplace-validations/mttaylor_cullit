# =====================================================
#  Generate AI-powered release notes (manual only)
# =====================================================
#
# This workflow is NOT triggered on tag push — publish.yml
# handles release note generation during the publish pipeline.
# Use this workflow to manually (re)generate notes for a tag.

name: Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.6.0)'
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for commit diffs

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @cullit/config build && pnpm --filter @cullit/core build && pnpm --filter cullit build

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: ollama serve &
        
      - name: Pull Ollama model
        run: |
          # Wait for Ollama server to be ready
          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Generate release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/generate-release-notes.mjs ${{ inputs.version }}

      - name: Commit & push release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add site/releases/
          # Only commit if there are changes
          git diff --cached --quiet || {
            git commit -m "docs: generate release notes for ${{ inputs.version }} [skip ci]"
            git push origin main
          }
