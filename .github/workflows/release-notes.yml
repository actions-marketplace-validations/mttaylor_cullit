# =====================================================
#  Cullit — AI Release Notes
#  Sample GitHub Actions workflow
# =====================================================
#
# This workflow generates release notes automatically
# whenever you push a new version tag (v*).
#
# Setup:
#   1. Add your AI provider API key as a repository secret
#      (e.g., ANTHROPIC_API_KEY, OPENAI_API_KEY)
#   2. (Optional) Add SLACK_WEBHOOK or DISCORD_WEBHOOK secrets
#   3. Push a tag: git tag v1.0.0 && git push origin v1.0.0
#
# Docs: https://cullit.io

name: Release Notes

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # Needed for GitHub Release publishing

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history needed for commit analysis

      - name: Generate Release Notes
        id: cullit
        uses: deployordie/cullit@v1
        with:
          provider: anthropic
          audience: developer
          tone: professional
          format: markdown
          publish-github-release: 'true'
          # publish-slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          # publish-discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Release Notes Generated 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.cullit.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:** ${{ steps.cullit.outputs.change-count }}" >> $GITHUB_STEP_SUMMARY
