# =====================================================
#  Cullit CI — Test & Build on every push / PR
# =====================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify GitHub Action bundle is up to date
        run: git diff --exit-code -- dist/action.js

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: E2E Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          pnpm test:e2e

      - name: Validate open-source and legal guards
        run: pnpm validate:guards

      - name: Security audit
        run: pnpm audit --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: cullit-api:test
          load: true

      - name: Scan container image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cullit-api:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
