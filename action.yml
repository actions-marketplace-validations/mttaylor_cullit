name: 'Cullit — AI Release Notes'
description: 'Generate intelligent, categorized release notes from your git history using AI. Supports Claude & OpenAI with BYOK.'
author: 'Cullit'

branding:
  icon: 'file-text'
  color: 'yellow'

inputs:
  from:
    description: 'Start ref (tag, branch, or commit SHA). If omitted, uses previous tag.'
    required: false
  to:
    description: 'End ref (tag, branch, or commit SHA). Defaults to HEAD.'
    required: false
    default: 'HEAD'
  provider:
    description: 'AI provider: anthropic, openai, gemini, ollama, or none'
    required: false
    default: 'none'
  model:
    description: 'AI model to use (e.g., claude-sonnet-4-20250514, gpt-4o)'
    required: false
  audience:
    description: 'Target audience: developer, end-user, or executive'
    required: false
    default: 'developer'
  tone:
    description: 'Writing tone: professional, casual, terse, edgy, hype, or snarky'
    required: false
    default: 'professional'
  source:
    description: 'Source type: local (free), jira (paid), linear (paid), gitlab (paid), bitbucket (paid), or multi-repo (paid). Non-local sources require a CULLIT_API_KEY.'
    required: false
    default: 'local'
  format:
    description: 'Output format: markdown, html, html-dark, html-minimal, html-edgy, or json'
    required: false
    default: 'markdown'
  publish-slack-webhook:
    description: 'Slack webhook URL to publish release notes'
    required: false
  publish-discord-webhook:
    description: 'Discord webhook URL to publish release notes'
    required: false
  publish-github-release:
    description: 'Set to "true" to create/update GitHub Release'
    required: false
    default: 'false'
  publish-teams-webhook:
    description: 'Microsoft Teams webhook URL to publish release notes'
    required: false
  publish-confluence:
    description: 'Set to "true" to publish to Confluence (requires CONFLUENCE_EMAIL and CONFLUENCE_API_TOKEN env vars)'
    required: false
    default: 'false'
  publish-notion:
    description: 'Set to "true" to publish to Notion database (requires NOTION_API_KEY env var)'
    required: false
    default: 'false'
  publish-gitlab-release:
    description: 'Set to "true" to create/update GitLab Release (requires GITLAB_TOKEN env var)'
    required: false
    default: 'false'
  publish-changelog:
    description: 'Set to "true" to push to Cullit hosted changelog (requires CULLIT_API_KEY env var)'
    required: false
    default: 'false'
  jira-domain:
    description: 'Jira domain (e.g., yourcompany.atlassian.net) for ticket enrichment'
    required: false
  config:
    description: 'Path to .cullit.yml config file'
    required: false
  api-key:
    description: 'Cullit API key for paid features. Set as CULLIT_API_KEY env var or pass here.'
    required: false

outputs:
  release-notes:
    description: 'Generated release notes content'
  version:
    description: 'Version string (to ref)'
  change-count:
    description: 'Number of changes in the release'

runs:
  using: 'node22'
  main: 'dist/action.js'
